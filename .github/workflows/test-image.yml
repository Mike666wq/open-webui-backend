name: Test published image
on:
  workflow_dispatch:
    inputs:
      image:
        description: latest, sha-<source SHA>, or sha256:<digest>
        default: latest
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve and test an immutable image
        env:
          IMAGE_SELECTION: ${{ inputs.image }}
        run: python scripts/test_published_image.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-image-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-smoke/
          if-no-files-found: warn
          retention-days: 7
