name: Sync verified frontend and build

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild even if this source already has a build run
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: frontend-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve published frontend, commit lock and dispatch build
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNSTREAM_WORKFLOW: backend.yml
          PIPELINE_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild && 'true' || 'false' }}
        run: python scripts/sync_frontend.py
